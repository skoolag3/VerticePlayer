plugins { id 'com.android.application' }
android {
    namespace 'com.oneshot.surround'
    compileSdk 35
    defaultConfig { applicationId 'com.oneshot.surround'; minSdk 26; targetSdk 34; versionCode 33; versionName '0.17.14'; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
    compileOptions { encoding 'UTF-8' }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
